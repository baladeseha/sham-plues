name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # إعداد بيئة جافا (ضرورية لبناء أندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # إعداد بيئة فلاتر (إذا كان مشروعك Flutter)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # يمكنك تغيير هذا لإصدار فلاتر الذي تستخدمه
          channel: 'stable'
          cache: true

      # تحميل الحزم
      - name: Install dependencies
        run: flutter pub get

      # بناء ملف الـ APK
      - name: Build APK
        run: flutter build apk --release

      # رفع الملف الناتج لكي تتمكن من تحميله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
