name: Build Sham Plus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies & build Vite frontend
        run: |
          npm install
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Capacitor & configure Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sham Plus" "com.shamplus.app" --web-dir="dist" || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android permissions & cleartext traffic
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - << 'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r", encoding="utf-8") as f:
              content = f.read()

          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />'
          ]
          for perm in perms:
              if perm not in content:
                  content = content.replace("<application", perm + "\n    <application", 1)

          if "usesCleartextTraffic" not in content:
              content = content.replace("<application", '<application android:usesCleartextTraffic="true"', 1)

          with open(p, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sham-Plus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
